<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Futuriza - Login</title>
<style>
*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0254E6,#00358f);display:flex;align-items:center;justify-content:center}.card{width:min(420px,90%);background:white;border-radius:28px;padding:38px;box-shadow:0 20px 50px #001b55aa;text-align:center}.logo{margin:auto;width:120px;height:120px;position:relative}.f{font-size:90px;font-weight:900;color:#0254E6}.arrow{position:absolute;color:#FBBF05;font-size:55px;top:35px;left:30px;transform:rotate(-15deg)}h1{color:#0254E6;margin:10px 0 5px;font-size:34px}p{color:#666}.input{width:100%;padding:15px;border:1px solid #ddd;border-radius:14px;margin:8px 0;font-size:15px}.options{display:flex;justify-content:space-between;font-size:12px;color:#666;margin:12px 0}.button{width:100%;padding:15px;border:0;border-radius:14px;background:#0254E6;color:white;font-weight:bold;font-size:16px;cursor:pointer}.button:hover{background:#003fb0}.footer{margin-top:20px;color:#777;font-size:13px}.yellow{color:#FBBF05;font-weight:bold}</style>
</head>
<body>
<div class="card">
<div class="logo"><div class="f">F</div><div class="arrow">➜</div></div>
<h1>Futuriza</h1>
<p>Encontre o caminho ideal para o seu futuro.</p>
<input class="input" placeholder="E-mail" />
<input class="input" placeholder="Senha" type="password" />
<div class="options"><span>☐ Lembrar de mim</span><span>Esqueci a senha</span></div>
<button class="button">Entrar</button>
<div class="footer">Ainda não possui conta? <span class="yellow">Criar agora</span></div>
</div>
</body>
</html>
